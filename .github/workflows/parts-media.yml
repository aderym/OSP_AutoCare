name: Parts media library
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:parts-media
      - run: node --experimental-strip-types tests/parts-finder.ts
      - run: node --experimental-strip-types tests/parts-catalog.ts
      - run: pnpm exec tsc --noEmit --incremental false
