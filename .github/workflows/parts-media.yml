name: Parts media library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:parts-media
      - run: node --experimental-strip-types tests/parts-finder.ts
      - run: node --experimental-strip-types tests/parts-catalog.ts
      - run: pnpm exec tsc --noEmit --incremental false
      - run: node --import tsx tests/component-drawings.tsx
      - run: node --import tsx tests/parts-browser.tsx
      - run: node --experimental-strip-types tests/local-part-media.ts
      - run: node --experimental-strip-types tests/vehicle-studio.ts
      - run: pnpm exec vite build --config standalone/vite.config.ts
      - run: docker build -f deployment/Dockerfile -t osp-autocare:ci .
      - run: python3 scripts/package-complete.py --output deliverables/OSP_AutoCare-completo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSP_AutoCare-completo
          path: deliverables/OSP_AutoCare-completo.zip
          retention-days: 90
