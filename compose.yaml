services:
  autocare:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-101010}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY:?Set PAYMENT_ENCRYPTION_KEY in .env first}
    volumes:
      - autocare_data:/app/runtime
    restart: unless-stopped
volumes:
  autocare_data:
